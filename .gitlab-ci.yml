# Pipeline CI/CD GitLab pour mypublicip
# Publication automatique vers Nexus PyPI sur jeysrv12

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHON_VERSION: "3.11"
  NEXUS_PYPI_URL: "http://jeysrv12:8081/repository/pypi-releases/"
  # pyvault-web is an internal dependency, so every pip invocation (including
  # the test job's editable install) must be able to resolve the Nexus index.
  PIP_EXTRA_INDEX_URL: "http://jeysrv12:8081/repository/pypi-releases/simple/"
  PIP_TRUSTED_HOST: "jeysrv12"
  PYVAULT_URL: "http://pyvault.int.jeyriku.net:8000"

cache:
  paths:
    - .cache/pip
    - venv/

stages:
  - test
  - build
  - publish
  - tag
  - mirror

.python_template: &python_template
  image: python:${PYTHON_VERSION}-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl
    - python -V
    - pip install --upgrade pip
    - pip install build twine pytest

# ========================================
# STAGE 1: Validation
# ========================================
test:quality:
  <<: *python_template
  stage: test
  script:
    - echo "📊 Vérification de la structure mypublicip..."
    - test -f pyproject.toml && echo "✅ pyproject.toml présent"
    - test -f README.md && echo "✅ README.md présent"
    - test -d mypublicip && echo "✅ Répertoire mypublicip présent"
    - pip install -e .
    - python -c "import mypublicip; print('✅ Import OK')"
    - echo "✅ Validation terminée"
  only:
    - branches
    - merge_requests
    - tags

# ========================================
# STAGE 2: Build
# ========================================
build:package:
  <<: *python_template
  stage: build
  script:
    - echo "📦 Build du package mypublicip..."
    - |
      CURRENT_VERSION=$(grep '^version = ' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
      echo "📦 Version: ${CURRENT_VERSION}"
    - python -m build
    - echo "📋 Packages créés:"
    - ls -lh dist/
  artifacts:
    paths:
      - dist/
      - pyproject.toml
    expire_in: 1 week
  only:
    - main
    - tags

# ========================================
# STAGE 3: Publication vers Nexus
# ========================================
publish:nexus:
  <<: *python_template
  stage: publish
  before_script:
    - apt-get update -qq && apt-get install -y -qq git curl
    - python -V
    - pip install --upgrade pip
    - pip install build twine
    - pip install --trusted-host jeysrv12 --extra-index-url http://jeysrv12:8081/repository/pypi-releases/simple/ "pyvault-web>=1.1.1"
  script:
    - echo "🚀 Publication mypublicip vers Nexus PyPI Repository..."
    - echo "Repository -> ${NEXUS_PYPI_URL}"
    - python -m pyvault.client configure-nexus
    - echo "📤 Upload vers Nexus..."
    - |
      PKG_VERSION=$(grep '^version = ' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
      if curl -sf "http://jeysrv12:8081/repository/pypi-releases/simple/mypublicip/" 2>/dev/null | grep -q "${PKG_VERSION}"; then
        echo "ℹ️ Version ${PKG_VERSION} déjà présente sur Nexus — upload ignoré"
      else
        twine upload --repository nexus dist/* --verbose
        echo "✅ mypublicip publié avec succès sur Nexus!"
      fi
    - echo "📍 Accès -> http://jeysrv12:8081/repository/pypi-releases/"
  dependencies:
    - build:package
  only:
    - main
    - tags
  when: on_success

cleanup:on_failure:
  stage: publish
  script:
    - echo "🧹 Nettoyage après échec du pipeline..."
    - rm -rf dist/ build/ *.egg-info
    - echo "✅ Nettoyage terminé"
  when: on_failure
  allow_failure: true

# ========================================
# STAGE 4: Mirror GitLab -> GitHub
# ========================================
# ========================================
# STAGE 4: Tag de version automatique
# ========================================
tag:version:
  stage: tag
  image: alpine:3.20
  script:
    - apk add --no-cache curl
    - VERSION=$(grep '^version = ' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
    - echo "🏷️ Création du tag ${VERSION}..."
    - |
      RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
        -X POST "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/tags" \
        --header "PRIVATE-TOKEN: ${GITLAB_API_TOKEN}" \
        --data "tag_name=${VERSION}&ref=${CI_COMMIT_SHA}")
    - |
      if [ "$RESPONSE" = "201" ]; then
        echo "✅ Tag ${VERSION} créé"
      elif [ "$RESPONSE" = "400" ]; then
        echo "ℹ️ Tag ${VERSION} existe déjà, skip"
      else
        echo "❌ Création tag échouée (HTTP ${RESPONSE})"
        exit 1
      fi
  only:
    - main


mirror:github:
  stage: mirror
  image: alpine:3.20
  before_script:
    - apk add --no-cache git
  script:
    - echo "🔁 Mirror mypublicip vers GitHub..."
    - |
      if [ -z "${GITHUB_MIRROR_TOKEN:-}" ]; then
        echo "❌ Missing GITHUB_MIRROR_TOKEN CI variable"
        exit 1
      fi
    - git config --global user.email "ci@jeyriku.net"
    - git config --global user.name "GitLab CI"
    - git remote add github-mirror "https://x-access-token:${GITHUB_MIRROR_TOKEN}@github.com/jeyriku/mypublicip.git"
    - git push --force github-mirror "HEAD:refs/heads/main"
    - git push --force github-mirror --tags
    - echo "✅ Mirror GitHub mypublicip OK"
  only:
    - main
    - tags
  when: on_success
